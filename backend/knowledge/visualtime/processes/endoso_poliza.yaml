key: endoso_poliza
title: Endoso de póliza
version: 1.0.0
tags: [polizas, endoso]

preconditions:
  - login
  - poliza_existente

variables:
  # Ambiente y credenciales (los carga el QA por caso)
  - { name: base_url, type: string, required: true, example: "http://172.16.70.172/dropthings" }
  - { name: user, type: string, required: true, example: "admin" }
  - { name: pass, type: string, required: true, example: "admin123" }

  # Datos propios del proceso
  - { name: numero_poliza, type: string, required: true, example: "POL-123456" }
  - { name: nuevo_valor, type: string, required: true, example: "Av. Siempre Viva 742" }

asserts: []

examples:
  - name: smoke_endoso_generico
    data:
      base_url: "http://172.16.70.172/dropthings"
      user: "admin"
      pass: "admin123"
      numero_poliza: "POL-123456"
      nuevo_valor: "Av. Siempre Viva 742"

template_dsl: |
  # Home + Login
  NAV path="/"
  CLICK sel=@botonAbrirLogin
  TYPE sel=@inputUsuario value=${user}
  TYPE sel=@inputPassword value=${pass}
  CLICK sel=@botonIngresar

  # Buscar póliza y abrir Endosos
  TYPE sel=@inputBuscarPoliza value=${numero_poliza}
  CLICK sel=@botonBuscarPoliza
  CLICK sel=@filaPoliza
  CLICK sel=@tabEndosos
  CLICK sel=@botonNuevoEndoso

  # Modificación genérica (completa el QA el campo exacto en selectors.csv)
  TYPE sel=@inputCampoObjetivo value=${nuevo_valor}

  # Guardar
  CLICK sel=@botonGuardarEndoso
