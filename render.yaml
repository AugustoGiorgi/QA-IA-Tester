services:
  - type: web
    name: qa-doc-analyzer
    runtime: python
    rootDir: .
    buildCommand: cd backend && pip install --upgrade pip && pip install --no-cache-dir --force-reinstall -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB
        value: Life_Projects
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.4
      - key: QA_OPENAI_MODEL
        value: gpt-5.4
      - key: OPENAI_REASONING_EFFORT
        value: medium
      - key: OPENAI_MAX_COMPLETION_TOKENS
        value: "16000"
      - key: APP_BASE_URL
        sync: false
      - key: MAX_IMPORT_FILE_MB
        value: "20"
      - key: IMPORT_BATCH_SIZE
        value: "500"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_TLS
        value: "true"
