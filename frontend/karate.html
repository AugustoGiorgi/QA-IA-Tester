<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Karate</title>
  <link rel="stylesheet" href="/app/dashboard.css?v=20261001-2" />
  <link rel="stylesheet" href="/app/data-queries.css?v=20261020-1" />
  <style>
    :root { color-scheme: dark; }
    *, *::before, *::after { box-sizing: border-box; }
    body.module-page { background:#0b1220; color:#f8fafc; font-family:Inter,Segoe UI,Arial,sans-serif; }
    body.module-page .module-container { padding:16px; }
    .k-form { width:min(900px,100%); margin:0 auto; display:grid; gap:16px; padding:8px 0 24px; }
    .k-drop { min-height:178px; display:grid; place-items:center; gap:10px; padding:22px; border:2px dashed #4b76aa; border-radius:8px; background:#0c1729; text-align:center; cursor:pointer; }
    .k-drop:hover, .k-drop.dragover { border-color:#93c5fd; background:#12264a; }
    .k-drop input { display:none; }
    .k-icon { width:54px; height:54px; display:grid; place-items:center; border-radius:8px; background:#2563eb; color:#fff; font-size:1.8rem; line-height:1; }
    .k-drop strong { color:#f8fafc; font-size:1rem; }
    .k-hint { color:#94a3b8; font-size:.85rem; }
    .k-files { display:flex; flex-wrap:wrap; justify-content:center; gap:6px; max-width:100%; color:#94a3b8; font-size:.82rem; }
    .k-file { max-width:100%; overflow-wrap:anywhere; border:1px solid #37537b; border-radius:6px; padding:5px 8px; background:#14294b; color:#dbeafe; }
    .k-form label:not(.k-drop) { display:grid; gap:8px; color:#f8fafc; font-weight:700; }
    .k-form input:not([type="file"]), .k-form textarea { width:100%; min-height:42px; padding:10px 12px; border:1px solid #34465e; border-radius:8px; background:#08111f; color:#f8fafc; font:inherit; }
    .k-form textarea { min-height:92px; resize:vertical; }
    .k-form input:focus, .k-form textarea:focus { outline:2px solid #60a5fa; outline-offset:1px; }
    .k-primary, .k-secondary { min-height:44px; padding:0 16px; border-radius:8px; font:inherit; font-weight:800; cursor:pointer; }
    .k-primary { border:1px solid #60a5fa; background:#2563eb; color:#fff; }
    .k-primary:hover { background:#3474f5; }
    .k-secondary { border:1px solid #37537b; background:#13213b; color:#dbeafe; }
    .k-secondary:hover { border-color:#60a5fa; }
    .k-primary:disabled { opacity:.55; cursor:wait; }
    .k-status { min-height:22px; color:#fecaca; font-weight:700; }
    .k-status.ok { color:#86efac; }
    .k-result { display:grid; gap:14px; padding-top:14px; border-top:1px solid #34465e; }
    .k-result[hidden], .k-pending[hidden], .k-result button[hidden], .k-result details[hidden] { display:none; }
    .k-result > strong { color:#bbf7d0; }
    .k-actions { display:flex; flex-wrap:wrap; gap:10px; }
    .k-pending { display:grid; gap:9px; color:#dbeafe; font-size:.87rem; }
    .k-pending ul { margin:0; padding-left:20px; line-height:1.55; overflow-wrap:anywhere; }
    .k-pending summary { cursor:pointer; color:#cbd5e1; }
    @media (max-width:600px) { .k-drop { min-height:155px; padding:16px; } .k-actions { display:grid; } }
  </style>
</head>
<body class="module-page">
  <main class="module-container">
    <form id="karateForm" class="k-form">
      <label class="k-drop" id="kDropzone">
        <span class="k-icon" aria-hidden="true">↓</span>
        <strong>Soltá acá los archivos o seleccioná desde tu equipo</strong>
        <span class="k-hint">Collections o requests JSON, OpenAPI, cURL, funcional DOCX/PDF y casos XLSX/CSV</span>
        <span class="k-files" id="kFiles">Archivos todavía no seleccionados</span>
        <input id="kSources" type="file" multiple accept=".json,.yaml,.yml,.txt,.md,.curl,.http,.docx,.pdf,.xlsx,.csv" />
      </label>
      <label for="kProject">Nombre del proyecto
        <input id="kProject" type="text" maxlength="180" placeholder="Ej.: Propuesta Caución - regresión" required />
      </label>
      <label for="kNotes">Comentarios o indicaciones
        <textarea id="kNotes" rows="3" placeholder="Reglas de negocio, datos a parametrizar o aclaraciones"></textarea>
      </label>
      <button id="kGenerate" class="k-primary" type="submit">Generar proyecto Karate</button>
      <div id="kStatus" class="k-status" role="status" aria-live="polite"></div>
      <section id="kResult" class="k-result" hidden>
        <strong>Proyecto generado</strong>
        <div class="k-actions">
          <button id="kDownload" class="k-primary" type="button">Descargar ZIP</button>
          <button id="kNew" class="k-secondary" type="button">Nuevo proyecto</button>
        </div>
        <div id="kPending" class="k-pending" hidden>
          <strong id="kMissingSummary"></strong>
          <ul id="kMissingList"></ul>
          <details id="kMoreMissing" hidden><summary id="kMoreMissingSummary"></summary><ul id="kMoreMissingList"></ul></details>
          <div id="karateDataQueries" class="qa-data-queries" hidden></div>
          <details id="kManual" hidden><summary>Revisiones manuales</summary><ul id="kManualList"></ul></details>
        </div>
      </section>
    </form>
  </main>
  <script type="module" src="/app/js/karate.js?v=20261020-1"></script>
</body>
</html>
