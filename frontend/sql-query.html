<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Consultas SQL</title>
  <link rel="stylesheet" href="/app/dashboard.css?v=20261015-4" />
  <link rel="stylesheet" href="/app/sql-query.css?v=20261015-4" />
</head>
<body class="module-page sql-page">
  <main class="module-container sql-container">
    <header class="sql-toolbar">
      <div class="sql-tabs" role="tablist" aria-label="Secciones de consultas SQL">
        <button type="button" class="sql-tab active" data-tab="chat" role="tab" aria-selected="true">Chat</button>
        <button type="button" class="sql-tab" data-tab="knowledge" role="tab" aria-selected="false">Conocimiento funcional</button>
      </div>
    </header>

    <section id="chatView" class="sql-view">
      <div id="chatNotice" class="sql-notice" role="status"></div>
      <div id="messages" class="sql-messages" aria-live="polite"></div>
      <form id="messageForm" class="sql-composer">
        <label for="userMessage">Escribí la consulta</label>
        <textarea id="userMessage" maxlength="8000" rows="3" placeholder="Escribí la consulta…" required></textarea>
        <div class="sql-composer-footer">
          <button id="sendMessage" class="sql-button primary" type="submit">Enviar</button>
        </div>
      </form>
    </section>

    <section id="knowledgeView" class="sql-view" hidden>
      <div class="sql-panel-head">
        <div><h2>Conocimiento funcional del equipo</h2><p>Agregá acá definiciones que deban reutilizarse. Las respuestas del chat SQL normal no se guardan como conocimiento.</p></div>
        <button id="addKnowledge" class="sql-button primary" type="button">Agregar definición</button>
      </div>
      <form id="knowledgeForm" class="sql-knowledge-form" hidden>
        <label>Concepto<input id="knowledgeTerm" maxlength="180" placeholder="Ej.: póliza vigente" required /></label>
        <label>Definición<textarea id="knowledgeDefinition" maxlength="3000" rows="3" placeholder="Describí la regla de negocio que debe reutilizarse" required></textarea></label>
        <div class="sql-form-actions"><button id="cancelKnowledge" class="sql-button secondary" type="button">Cancelar</button><button class="sql-button primary" type="submit">Guardar</button></div>
      </form>
      <div id="knowledgeList" class="sql-knowledge-list"></div>
    </section>
  </main>
  <script type="module" src="/app/js/sql-query.js?v=20261019-1"></script>
</body>
</html>
