<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Playwright | QA Doc Analyzer</title>
  <link rel="stylesheet" href="/app/dashboard.css?v=20261005-1" />
  <style>
    :root { --pw-line:#26354d; --pw-muted:#94a3b8; --pw-text:#f8fafc; --pw-panel:#101a2c; --pw-input:#08111f; --pw-blue:#2563eb; --pw-blue-hover:#1d4ed8; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--pw-text); font-family:system-ui,-apple-system,'Segoe UI',sans-serif; background:#0b1220; }
    .pw-shell { width:min(1100px,100%); margin:0 auto; padding:28px 24px 56px; }
    .pw-head { display:flex; align-items:center; justify-content:space-between; gap:20px; padding-bottom:20px; border-bottom:1px solid var(--pw-line); }
    .pw-head h1 { margin:0; font-size:30px; }
    .pw-head p { margin:6px 0 0; color:var(--pw-muted); }
    .pw-form { display:grid; gap:18px; padding:24px 0; }
    .pw-meta { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .pw-field { display:grid; gap:7px; min-width:0; }
    .pw-field label,.pw-label { font-size:14px; font-weight:700; }
    .pw-field input,.pw-field textarea,.pw-variable input { width:100%; min-width:0; border:1px solid var(--pw-line); border-radius:7px; background:var(--pw-input); color:var(--pw-text); padding:11px 12px; font:inherit; }
    .pw-field textarea { min-height:96px; resize:vertical; }
    .pw-field input:focus,.pw-field textarea:focus,.pw-variable input:focus { outline:2px solid #2563eb66; border-color:#60a5fa; }
    .pw-drop { min-height:172px; display:grid; place-items:center; border:1px dashed #4b79b8; border-radius:8px; padding:20px; text-align:center; background:#0d1a30; cursor:pointer; transition:border-color .15s,background .15s; }
    .pw-drop:hover,.pw-drop.dragging { border-color:#60a5fa; background:#102344; }
    .pw-drop input { position:absolute; width:1px; height:1px; opacity:0; }
    .pw-drop-content { display:grid; justify-items:center; gap:8px; pointer-events:none; }
    .pw-drop-icon { display:grid; place-items:center; width:42px; aspect-ratio:1; border-radius:8px; background:var(--pw-blue); font-size:23px; }
    .pw-drop strong { font-size:17px; }
    .pw-muted { color:var(--pw-muted); font-size:13px; }
    .pw-file-list { display:flex; flex-wrap:wrap; justify-content:center; gap:6px; max-width:100%; }
    .pw-file { max-width:100%; overflow-wrap:anywhere; padding:4px 8px; border:1px solid #344d72; border-radius:999px; background:#13233d; color:#dbeafe; font-size:12px; }
    .pw-btn { min-height:42px; border:1px solid transparent; border-radius:7px; padding:0 16px; background:var(--pw-blue); color:white; font:inherit; font-weight:750; cursor:pointer; }
    .pw-btn:hover:not(:disabled) { background:var(--pw-blue-hover); }
    .pw-btn.secondary { border-color:var(--pw-line); background:#142238; }
    .pw-btn:disabled { opacity:.55; cursor:wait; }
    .pw-form-actions,.pw-result-actions { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .pw-form-actions .pw-btn { min-width:190px; }
    .pw-status { min-height:20px; color:#fca5a5; font-size:14px; }
    .pw-status.ok { color:#86efac; }
    .pw-hidden { display:none !important; }
    .pw-result { margin-top:20px; padding-top:20px; border-top:1px solid var(--pw-line); }
    .pw-summary { display:flex; gap:18px; flex-wrap:wrap; padding:12px 0; color:#dbeafe; }
    .pw-summary strong { color:white; }
    .pw-result h2 { margin:0 0 12px; font-size:19px; }
    .pw-case-list { list-style:none; margin:0; padding:0; border-top:1px solid var(--pw-line); }
    .pw-case { display:flex; align-items:flex-start; gap:14px; padding:13px 2px; border-bottom:1px solid var(--pw-line); }
    .pw-case-id { flex:none; min-width:76px; color:#93c5fd; font-size:13px; font-weight:750; }
    .pw-case-title { font-weight:700; }
    .pw-case-source { margin-top:4px; color:var(--pw-muted); font-size:12px; }
    .pw-section { margin-top:22px; }
    .pw-section details { border-top:1px solid var(--pw-line); padding:12px 0; }
    .pw-section summary { cursor:pointer; color:#dbeafe; font-weight:700; }
    .pw-variable-list { display:grid; grid-template-columns:1fr 1fr; gap:12px 16px; padding:14px 0 4px; }
    .pw-variable { display:grid; gap:5px; min-width:0; }
    .pw-variable label { overflow-wrap:anywhere; font-size:12px; color:#cbd5e1; }
    .pw-variable input.todo { border-color:#a16207; }
    .pw-pending-list { margin:10px 0 0; padding-left:20px; color:#fde68a; }
    .pw-pending-list li { padding:4px 0; }
    @media(max-width:700px) { .pw-shell{padding:20px 16px 40px}.pw-meta,.pw-variable-list{grid-template-columns:1fr}.pw-head{align-items:flex-start}.pw-head h1{font-size:25px}.pw-form-actions .pw-btn{width:100%} }
  </style>
</head>
<body>
  <main class="pw-shell">
    <header class="pw-head"><div><h1>Playwright</h1><p>Proyecto de automatización</p></div></header>
    <form id="pwForm" class="pw-form">
      <div class="pw-meta">
        <div class="pw-field"><label for="projectName">Nombre del proyecto</label><input id="projectName" name="project_name" required maxlength="120" placeholder="Alta de tomador" /></div>
        <div class="pw-field"><label for="initialUrl">URL inicial <span class="pw-muted">(opcional)</span></label><input id="initialUrl" name="initial_url" type="text" placeholder="https://ambiente.ejemplo.com o /ruta" /></div>
      </div>
      <label class="pw-drop" id="dropZone" for="filesInput">
        <input id="filesInput" type="file" multiple accept=".docx,.pdf,.xlsx,.csv,.txt,.md,.json,.yaml,.yml,.mp4,.webm,.mov,.mkv" />
        <span class="pw-drop-content"><span class="pw-drop-icon" aria-hidden="true">↑</span><strong>Soltá documentos o videos, o seleccioná archivos</strong><span class="pw-muted">DOCX, PDF, Excel, CSV, texto o video</span><span id="fileList" class="pw-file-list"><span class="pw-muted">Todavía no seleccionaste archivos</span></span></span>
      </label>
      <div class="pw-field"><label for="comments">Comentarios o aclaraciones <span class="pw-muted">(opcional)</span></label><textarea id="comments" maxlength="6000" placeholder="Datos de prueba, reglas, decisiones o aclaraciones que no estén en los archivos"></textarea></div>
      <div class="pw-form-actions"><button id="generateButton" class="pw-btn" type="submit">Generar proyecto</button><span id="formStatus" class="pw-status" role="status" aria-live="polite"></span></div>
    </form>
    <section id="result" class="pw-result pw-hidden" aria-live="polite">
      <h2 id="resultTitle">Proyecto generado</h2>
      <p id="resultNote" class="pw-muted"></p>
      <div class="pw-summary"><span><strong id="caseCount">0</strong> casos</span><span><strong id="pendingCount">0</strong> pendientes para completar</span></div>
      <ol id="caseList" class="pw-case-list"></ol>
      <div id="variablesSection" class="pw-section"></div>
      <div id="manualSection" class="pw-section"></div>
      <div class="pw-result-actions"><button id="downloadButton" class="pw-btn" type="button">Descargar proyecto ZIP</button><button id="newButton" class="pw-btn secondary" type="button">Crear otro proyecto</button><span id="downloadStatus" class="pw-status" role="status" aria-live="polite"></span></div>
    </section>
  </main>
  <script type="module" src="/app/js/playwright_xlsx.js?v=20261005-1"></script>
</body>
</html>
