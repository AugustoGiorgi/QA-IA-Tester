<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Postman</title>
  <link rel="stylesheet" href="/app/dashboard.css?v=20260724-2" />
  <style>
    :root {
      --pm-bg: #07101f;
      --pm-panel: rgba(15, 23, 42, .94);
      --pm-panel-soft: rgba(8, 17, 31, .72);
      --pm-line: rgba(96, 165, 250, .24);
      --pm-line-strong: rgba(96, 165, 250, .48);
      --pm-blue: #2563eb;
      --pm-blue-2: #3b82f6;
      --pm-text: #f8fafc;
      --pm-muted: #94a3b8;
      --pm-green: #22c55e;
      --pm-yellow: #f59e0b;
      --pm-red: #ef4444;
    }

    body.module-page {
      background:
        radial-gradient(circle at 88% -12%, rgba(37, 99, 235, .18), transparent 28rem),
        linear-gradient(180deg, #0b1530 0%, var(--pm-bg) 58%);
    }

    body.module-page .module-container {
      padding: 26px;
    }

    body.module-page .page-head {
      margin-bottom: 18px;
      padding-bottom: 18px;
    }

    body.module-page .page-head h1 {
      font-size: clamp(2rem, 3vw, 2.7rem);
    }

    .postman-grid {
      display: grid;
      grid-template-columns: minmax(380px, 500px) minmax(0, 1fr);
      gap: 20px;
      align-items: start;
    }

    .postman-panel {
      border: 1px solid var(--pm-line);
      border-radius: 10px;
      background: linear-gradient(180deg, rgba(15, 23, 42, .96), rgba(8, 17, 31, .95));
      box-shadow: 0 18px 55px rgba(0, 0, 0, .2);
    }

    .postman-form {
      position: sticky;
      top: 18px;
      display: grid;
      gap: 18px;
      padding: 24px;
    }

    .postman-result {
      min-height: 620px;
      padding: 24px;
    }

    .pm-section {
      display: grid;
      gap: 10px;
    }

    .pm-section-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }

    .pm-section h2 {
      margin: 0;
      color: #fff;
      font-size: 1.08rem;
    }

    .pm-pill {
      display: inline-grid;
      min-width: 30px;
      height: 30px;
      place-items: center;
      border: 1px solid var(--pm-line-strong);
      border-radius: 999px;
      color: #bfdbfe;
      background: rgba(37, 99, 235, .16);
      font-size: .82rem;
      font-weight: 900;
    }

    .pm-dropzone {
      display: grid;
      min-height: 220px;
      place-items: center;
      gap: 12px;
      padding: 24px;
      border: 2px dashed rgba(96, 165, 250, .56);
      border-radius: 10px;
      box-sizing: border-box;
      background:
        radial-gradient(circle at top, rgba(37, 99, 235, .18), transparent 62%),
        rgba(8, 17, 31, .66);
      color: var(--pm-text);
      text-align: center;
      cursor: pointer;
      transition: border-color .18s ease, transform .18s ease, background .18s ease;
    }

    .pm-dropzone.compact {
      min-height: 132px;
      padding: 18px;
      border-style: solid;
      background: rgba(8, 17, 31, .58);
    }

    .pm-dropzone:hover {
      border-color: rgba(147, 197, 253, .82);
      background: rgba(37, 99, 235, .11);
      transform: translateY(-1px);
    }

    .pm-dropzone input {
      display: none;
    }

    .pm-icon {
      display: inline-grid;
      width: 58px;
      height: 58px;
      place-items: center;
      border: 1px solid rgba(147, 197, 253, .36);
      border-radius: 15px;
      background: linear-gradient(180deg, var(--pm-blue-2), var(--pm-blue));
      box-shadow: 0 16px 34px rgba(37, 99, 235, .28);
      color: #fff;
      font-weight: 900;
    }

    .pm-dropzone.compact .pm-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
    }

    .pm-upload-title {
      display: grid;
      gap: 4px;
      font-weight: 900;
    }

    .pm-upload-title small,
    .pm-help {
      color: var(--pm-muted);
      font-size: .82rem;
      line-height: 1.35;
    }

    .pm-files {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 7px;
      color: var(--pm-muted);
      font-size: .82rem;
    }

    .pm-file-chip {
      display: inline-flex;
      max-width: 100%;
      padding: 6px 9px;
      border: 1px solid rgba(96, 165, 250, .3);
      border-radius: 999px;
      color: #dbeafe;
      background: rgba(37, 99, 235, .13);
      font-size: .78rem;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .postman-form label:not(.pm-dropzone) {
      display: grid;
      gap: 8px;
      color: var(--pm-text);
      font-weight: 800;
    }

    .postman-form input,
    .postman-form textarea {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid rgba(96, 165, 250, .26) !important;
      border-radius: 8px !important;
      background: var(--pm-panel-soft) !important;
      color: var(--pm-text) !important;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .02) !important;
    }

    .postman-form input:focus,
    .postman-form textarea:focus {
      border-color: #60a5fa !important;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, .18) !important;
    }

    .pm-primary {
      min-height: 46px;
      border: 1px solid rgba(96, 165, 250, .52) !important;
      border-radius: 8px !important;
      color: #fff !important;
      background: linear-gradient(180deg, #2f6df3 0%, var(--pm-blue) 100%) !important;
      box-shadow: 0 16px 30px rgba(37, 99, 235, .24) !important;
      font-weight: 900 !important;
      cursor: pointer;
    }

    .pm-primary:hover {
      border-color: rgba(147, 197, 253, .72) !important;
      background: linear-gradient(180deg, var(--pm-blue-2), var(--pm-blue)) !important;
      transform: translateY(-1px);
    }

    .pm-primary:disabled {
      opacity: .58;
      cursor: wait;
      transform: none;
    }

    .pm-status {
      min-height: 22px;
      color: #fecaca;
      font-weight: 800;
    }

    .pm-status.ok {
      color: #86efac;
    }

    .pm-empty {
      display: grid;
      min-height: 520px;
      place-items: center;
      border: 1px solid rgba(148, 163, 184, .14);
      border-radius: 10px;
      background: rgba(8, 17, 31, .42);
      color: var(--pm-muted);
      text-align: center;
    }

    .pm-loader {
      display: grid;
      gap: 14px;
      justify-items: center;
      color: #dbeafe;
      text-align: center;
    }

    .pm-spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(96, 165, 250, .18);
      border-top-color: #60a5fa;
      border-radius: 999px;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .pm-summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin: 18px 0;
    }

    .pm-metric {
      display: grid;
      gap: 7px;
      min-height: 88px;
      padding: 14px;
      border: 1px solid var(--pm-line);
      border-radius: 10px;
      background: rgba(8, 17, 31, .48);
    }

    .pm-metric span {
      color: var(--pm-muted);
      font-size: .78rem;
      font-weight: 800;
    }

    .pm-metric strong {
      color: #fff;
      font-size: 1.7rem;
      line-height: 1;
    }

    .pm-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 14px 0 22px;
    }

    .pm-actions button {
      width: auto;
      min-height: 42px;
      padding: 0 15px !important;
    }

    .pm-guide {
      display: grid;
      gap: 10px;
      margin-top: 16px;
      padding: 16px;
      border: 1px solid var(--pm-line);
      border-radius: 10px;
      background: rgba(8, 17, 31, .46);
    }

    .pm-guide h3 {
      margin: 0;
      color: #fff;
      font-size: 1rem;
    }

    .pm-guide ol {
      margin: 0;
      padding-left: 20px;
      color: #dbeafe;
      line-height: 1.65;
    }

    .pm-case-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin: 0 0 18px;
    }

    .pm-case-box {
      display: grid;
      gap: 8px;
      padding: 14px;
      border: 1px solid rgba(96, 165, 250, .24);
      border-radius: 10px;
      background: rgba(37, 99, 235, .08);
      color: #dbeafe;
      font-size: .88rem;
    }

    .pm-case-box strong {
      color: #fff;
    }

    .pm-case-box.warn {
      border-color: rgba(245, 158, 11, .28);
      background: rgba(245, 158, 11, .08);
      color: #fde68a;
    }

    .pm-case-box.ok {
      margin: 0 0 18px;
      border-color: rgba(34, 197, 94, .28);
      background: rgba(34, 197, 94, .08);
      color: #bbf7d0;
    }

    @media (max-width: 980px) {
      .postman-grid,
      .pm-summary,
      .pm-case-grid {
        grid-template-columns: 1fr;
      }

      .postman-form {
        position: static;
      }
    }
  </style>
</head>
<body class="module-page">
  <main class="module-container">
    <header class="page-head">
      <h1>Postman</h1>
    </header>

    <section class="postman-grid">
      <form id="postmanForm" class="postman-panel postman-form">
        <section class="pm-section">
          <div class="pm-section-head">
            <h2>Archivos principales</h2>
            <span class="pm-pill">1</span>
          </div>
          <label class="pm-dropzone">
            <span class="pm-icon">API</span>
            <span class="pm-upload-title">
              <strong>Cargar documentos de la API</strong>
              <small>Collection, funcionales, Swagger, cURL, PDF, DOCX o TXT</small>
            </span>
            <span id="sourceSummary" class="pm-files">Sin archivos seleccionados</span>
            <input id="sourceFiles" type="file" multiple accept=".json,.yaml,.yml,.md,.txt,.docx,.pdf,.xml,.curl,.http,.csv,.xlsx" />
          </label>
        </section>

        <section class="pm-section">
          <div class="pm-section-head">
            <h2>Excel de casos</h2>
            <span class="pm-pill">2</span>
          </div>
          <label class="pm-dropzone compact">
            <span class="pm-icon">XLS</span>
            <span class="pm-upload-title">
              <strong>Opcional</strong>
              <small>Si lo cargas, se usa para comparar casos faltantes o sobrantes</small>
            </span>
            <span id="caseSummary" class="pm-files">Sin Excel cargado</span>
            <input id="caseFile" type="file" accept=".xlsx,.csv,.txt" />
          </label>
        </section>

        <label>Nombre del proyecto
          <input id="projectName" type="text" placeholder="Proyecto API" />
        </label>

        <label>Comentarios
          <textarea id="manualText" rows="6" placeholder="Aclaraciones, reglas de negocio, datos obligatorios, auth, ambiente o criterios especiales"></textarea>
        </label>

        <button id="analyzeBtn" class="pm-primary" type="submit">Generar collection</button>
        <div id="postmanStatus" class="pm-status"></div>
      </form>

      <section class="postman-panel postman-result">
        <div id="resultPanel" class="pm-empty">
          <p>Carga los insumos y genera la collection.</p>
        </div>
      </section>
    </section>
  </main>

  <script type="module" src="/app/js/postman.js?v=20260727-3"></script>
</body>
</html>
