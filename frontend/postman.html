<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Postman</title>
  <link rel="stylesheet" href="/app/dashboard.css?v=20260724-1" />
  <style>
    body.module-page .postman-grid { grid-template-columns: minmax(340px, 0.72fr) minmax(0, 1.28fr); }
    .postman-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .postman-tabs button { width: auto; min-height: 38px; padding: 9px 13px; background: #111c33; border: 1px solid #263958; color: #dbeafe; }
    .postman-tabs button.active { background: #2563eb; border-color: #60a5fa; color: #fff; }
    .postman-summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
    .pm-metric { border: 1px solid #253044; border-radius: 8px; padding: 12px; background: #0f172a; }
    .pm-metric span { display: block; color: #94a3b8; font-size: .78rem; }
    .pm-metric strong { color: #fff; font-size: 1.5rem; }
    .pm-list { display: grid; gap: 10px; }
    .pm-card { border: 1px solid #253044; border-left: 4px solid #2563eb; border-radius: 8px; padding: 12px; background: #0f172a; }
    .pm-card.warn { border-left-color: #f59e0b; }
    .pm-card.bad { border-left-color: #ef4444; }
    .pm-card.ok { border-left-color: #22c55e; }
    .pm-card-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
    .pm-card code { color: #bfdbfe; }
    .pm-editor { display: grid; gap: 10px; margin-top: 10px; }
    .pm-editor.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .pm-editor.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .pm-table { width: 100%; border-collapse: collapse; }
    .pm-table th, .pm-table td { padding: 10px; border-bottom: 1px solid #253044; text-align: left; vertical-align: top; }
    .pm-table th { color: #dbeafe; background: #0b1a30; }
    .pm-table select, .pm-table input { min-width: 160px; }
    .pm-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
    .pm-downloads a { display: inline-flex; width: auto; min-height: 40px; align-items: center; justify-content: center; padding: 0 14px; border: 1px solid rgba(96,165,250,.5); border-radius: 8px; background: #2563eb; color: #fff; font-weight: 800; text-decoration: none; }
    .hidden { display: none !important; }
    @media (max-width: 980px) {
      body.module-page .postman-grid, .postman-summary, .pm-editor.two, .pm-editor.three { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body class="module-page">
  <main class="module-container">
    <header class="page-head">
      <h1>Postman</h1>
      <p class="small muted">Genera colecciones Postman agnosticas desde documentacion, casos, cURL, OpenAPI o colecciones existentes.</p>
    </header>

    <section class="module-grid postman-grid">
      <form id="postmanForm" class="module-panel module-form">
        <h2>Fuentes de entrada</h2>
        <label>Nombre del proyecto
          <input id="projectName" type="text" placeholder="Proyecto API" />
        </label>
        <label class="dropzone" id="dropzone">
          <span class="drop-icon">API</span>
          <strong>Arrastra archivos o selecciona</strong>
          <span id="fileSummary" class="small muted">JSON, YAML, MD, TXT, DOCX, PDF, cURL o Postman</span>
          <input id="sourceFiles" type="file" multiple accept=".json,.yaml,.yml,.md,.txt,.docx,.pdf,.xml,.curl,.http" />
        </label>
        <label>Texto pegado
          <textarea id="manualText" rows="10" placeholder="Pega endpoints, cURL, casos de prueba, variables, ejemplos de request/response o documentacion tecnica"></textarea>
        </label>
        <button id="analyzeBtn" type="submit">Analizar fuentes</button>
        <div id="postmanStatus" class="field-error"></div>
      </form>

      <section class="module-panel">
        <div class="users-toolbar">
          <div>
            <h2>Revision humana</h2>
            <p class="small muted">Edita asociaciones, variables y requests antes de descargar.</p>
          </div>
          <button id="refreshDrafts" type="button" class="btn-secondary">Biblioteca</button>
        </div>
        <div id="summary" class="postman-summary"></div>
        <nav class="postman-tabs">
          <button type="button" class="active" data-tab="endpoints">Endpoints</button>
          <button type="button" data-tab="cases">Casos</button>
          <button type="button" data-tab="trace">Trazabilidad</button>
          <button type="button" data-tab="variables">Variables</button>
          <button type="button" data-tab="warnings">Advertencias</button>
          <button type="button" data-tab="downloads">Descargas</button>
        </nav>
        <div id="tabContent" class="pm-list">
          <p class="small muted">Carga fuentes para iniciar el analisis.</p>
        </div>
      </section>
    </section>
  </main>

  <script type="module" src="/app/js/postman.js?v=20260724-1"></script>
</body>
</html>
